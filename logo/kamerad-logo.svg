<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Kamerad</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23262E"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFBFC"/>
      <stop offset="1" stop-color="#E6E8EC"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF5A4E"/>
      <stop offset="1" stop-color="#E8392F"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A45"/>
      <stop offset="1" stop-color="#F07A22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#FF7A1A" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>

  <!-- signal -->
  <g fill="none" stroke="url(#orange)" stroke-width="38" stroke-linecap="round" filter="url(#glow)">
    <path d="M 752 196 A 66 66 0 0 1 818 262"/>
    <path d="M 752 130 A 132 132 0 0 1 884 262"/>
  </g>

  <!-- shutter button -->
  <rect x="598" y="300" width="148" height="64" rx="24" fill="url(#red)" filter="url(#soft)"/>

  <!-- camera body -->
  <rect x="232" y="342" width="560" height="440" rx="96" fill="url(#body)" filter="url(#shadow)"/>

  <!-- lens housing + lens -->
  <g filter="url(#soft)">
    <rect x="276" y="386" width="286" height="286" rx="70" fill="#16181D"/>
    <circle cx="419" cy="529" r="98" fill="#3A6EF5"/>
    <circle cx="419" cy="529" r="46" fill="#0A0C10"/>
    <circle cx="452" cy="494" r="18" fill="#FFFFFF" fill-opacity="0.85"/>
  </g>

  <!-- front screen -->
  <rect x="598" y="400" width="148" height="128" rx="26" fill="#16181D" filter="url(#soft)"/>

  <!-- record dot -->
  <circle cx="672" cy="690" r="30" fill="url(#red)" filter="url(#soft)"/>
</svg>
